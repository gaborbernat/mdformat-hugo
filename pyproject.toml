[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
]

[project]
name = "mdformat-hugo"
import-names = [ "mdformat_hugo" ]
description = "Mdformat plugin for Hugo-flavored Markdown"
keywords = [
  "formatter",
  "hugo",
  "markdown",
  "mdformat",
]
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "markdown-it-py>=4.2",
  "mdformat>=1",
  "mdformat-config>=0.2.1",
  "mdformat-deflist>=0.1.4",
  "mdformat-footnote>=0.1.3",
  "mdformat-front-matters>=2",
  "mdformat-gfm>=1",
  "mdformat-gfm-alerts>=2.1",
  "mdformat-pyproject>=0.1.1",
  "mdformat-ruff>=0.1.3",
  "mdformat-shfmt>=0.2",
  "mdformat-web>=0.2",
  "mdit-py-plugins>=0.6.1",
]
urls.Changelog = "https://github.com/gaborbernat/mdformat-hugo/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/gaborbernat/mdformat-hugo"
urls.Source = "https://github.com/gaborbernat/mdformat-hugo"
urls.Tracker = "https://github.com/gaborbernat/mdformat-hugo/issues"
entry-points."mdformat.parser_extension".hugo = "mdformat_hugo"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.16",
]
type = [
  "ty>=0.0.84",
  { include-group = "test" },
]
lint = [ "pre-commit-uv>=4.3" ]
pkg-meta = [ "check-wheel-contents>=0.6.3", "twine>=7", "uv>=0.12.22" ]
release = [
  "prek>=0.5",
  "release-creator @ git+https://github.com/tox-dev/release-creator@5ab33234939cf2969d25a11ba477c31eb264067c",
  "towncrier>=26.9",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = '''(?x)
    (?<!!)\[(?P<label>[^\]]+)\]\(  # Link text, excluding image syntax
    (?P<path>(?!https?://|\#|mailto:)[^)]+) # Relative path
    \)
    ''', replacement = '[\g<label>](https://github.com/gaborbernat/mdformat-hugo/blob/main/\g<path>)' },
]

[tool.uv]
dependency-groups.release = { requires-python = ">=3.15" }

[tool.ruff]
target-version = "py311"
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "any-type",                                  # allow Any as type annotation
  "CPY",                                       # No copyright statements
  "DOC",                                       # no support
  "hardcoded-bind-all-interfaces",             # Possible binding to all interface
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "single-line-implicit-string-concatenation", # Conflict with formatter
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # asserts allowed in tests
  "D",                                    # don't care about documentation in tests
  "FBT",                                  # don't care about booleans as positional arguments in tests
  "implicit-namespace-package",           # no implicit namespace
  "import-private-name",                  # Private name import
  "magic-value-comparison",               # Magic value used in comparison, consider replacing with a constant variable
  "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
  "suspicious-subprocess-import",         # `subprocess` module is possibly insecure
  "too-many-positional-arguments",        # Too many positional arguments
]
lint.isort = { known-first-party = [
  "mdformat_hugo",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.15"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.filterwarnings = [
  "error",
]
ini_options.verbosity_assertions = 2

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
run.core = "ctrace"  # sysmon (3.14+ default) cannot record the dynamic contexts --cov-context needs
paths.source = [
  "src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 100
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "mdformat-hugo"
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "release_creator.fragments:template.jinja2"
title_format = false
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]
