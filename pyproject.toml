[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "python-sbom[hatch]>=0.1.2",
]

[project]
name = "mdformat-hugo"
import-names = [ "mdformat_hugo" ]
description = "Mdformat plugin for Hugo-flavored Markdown"
keywords = [
  "formatter",
  "hugo",
  "markdown",
  "mdformat",
]
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "markdown-it-py>=4.2",
  "mdformat>=1",
  "mdformat-config>=0.2.1",
  "mdformat-deflist>=0.1.4",
  "mdformat-footnote>=0.1.3",
  "mdformat-front-matters>=2",
  "mdformat-gfm>=1",
  "mdformat-gfm-alerts>=2.1",
  "mdformat-pyproject>=0.1.1",
  "mdformat-ruff>=0.1.3",
  "mdformat-shfmt>=0.2",
  "mdformat-web>=0.2",
]
urls.Changelog = "https://github.com/gaborbernat/mdformat-hugo/blob/main/CHANGELOG.md"
urls.Homepage = "https://github.com/gaborbernat/mdformat-hugo"
urls.Source = "https://github.com/gaborbernat/mdformat-hugo"
urls.Tracker = "https://github.com/gaborbernat/mdformat-hugo/issues"
entry-points."mdformat.parser_extension".hugo = "mdformat_hugo"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-mock>=3.16",
]
type = [
  "ty>=0.0.84",
  { include-group = "test" },
]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "python-sbom[hatch]>=0.1.2",
  "setuptools>=80",
]
lint = [ "pre-commit-uv>=4.3" ]
pkg-meta = [ "check-wheel-contents>=0.6.3", "twine>=7", "uv>=0.12.22" ]
release-notes = [
  "release-creator>=4.4",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=4.4",
  "towncrier>=26.9",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
metadata.hooks.fancy-pypi-readme.substitutions = [
  { pattern = '''(?x)
    (?<!!)\[(?P<label>[^\]]+)\]\(  # Link text, excluding image syntax
    (?P<path>(?!https?://|\#|mailto:)[^)]+) # Relative path
    \)
    ''', replacement = '[\g<label>](https://github.com/gaborbernat/mdformat-hugo/blob/main/\g<path>)' },
]
build.hooks.python-sbom = {}

[tool.uv]
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }

[tool.ruff]
target-version = "py311"
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                    # No copyright statements
  "incorrect-blank-line-before-class",      # Conflicts with `blank-line-before-class`
  "missing-trailing-comma",                 # Conflict with formatter
  "multi-line-summary-first-line",          # Conflicts with `multi-line-summary-second-line`
  "undocumented-magic-method",              # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-class",              # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-function",           # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-init",               # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-method",             # undocumented-public-api (simplint) covers the public API instead
  "undocumented-public-nested-class",       # undocumented-public-api (simplint) covers the public API instead
  "unnecessary-regular-expression-compile", # conflicts with simplint inline-regex
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                     # asserts allowed in tests
  "implicit-namespace-package", # no implicit namespace
  "undocumented-public-module", # simplint test-module-docstring forbids test module docstrings
]
lint.isort = { known-first-party = [
  "mdformat_hugo",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.15"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.filterwarnings = [
  "error",
]
ini_options.verbosity_assertions = 2

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
run.core = "ctrace"  # sysmon (3.14+ default) cannot record the dynamic contexts --cov-context needs
paths.source = [
  "src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 100
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "mdformat-hugo"
directory = "changelog.d"
filename = "CHANGELOG.md"
template = "release_creator.fragments:template.jinja2"
title_format = false
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.python-sbom]
supplier = { name = "Bernát Gábor", url = [ "https://bernat.tech" ] }

[tool.nab]
mode = "universal"
base-group = "project-runtime"
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64" ]
# release-creator 4.4.0 needs a seven-day cutoff exception.
# expires 2026-11-17
packages.release-creator.uploaded-prior-to = 2026-11-02T21:45:00Z
# python-sbom 0.1.2 needs a seven-day cutoff exception.
# expires 2026-11-15
packages.python-sbom.uploaded-prior-to = 2026-11-08T17:54:00Z
