ci:
  autoupdate_schedule: quarterly
default_language_version:
  python: python3.15
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: file-contents-sorter
        files: "^.gitignore$"
      - id: check-case-conflict
      - id: check-added-large-files
  - repo: https://github.com/rhysd/actionlint
    rev: "914e7df21a07ef503a81201c76d2b11c789d3fca" # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # frozen: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/tox-dev/tox-toml-fmt
    rev: "5125f601c3e134347288c3d42f3b34298b7cf1be" # frozen: v1.11.1
    hooks:
      - id: tox-toml-fmt
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "50e0f3aee9dc5747a5f173f79a7417403c18dda6" # frozen: v2.30.3
    hooks:
      - id: pyproject-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "38bfb07c0c64c304f47eb52090f8288150c77730" # frozen: v0.17.1
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: ["--fix", "--unsafe-fixes", "--exit-non-zero-on-fix"]
  - repo: https://github.com/google/yamlfmt
    rev: "21ca5323a9c87ee37a434e0ca908efc0a89daa07" # frozen: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        entry: uvx --from mdformat --with . mdformat --wrap 120
        language: system
        types: [markdown]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
