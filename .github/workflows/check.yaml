name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "31 10 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    name: 🧪 test
    if: github.event_name != 'schedule' || github.repository_owner == 'gaborbernat'
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
    permissions:
      contents: read
    with:
      os: ubuntu-24.04
      include: |
        [
          {"env": "3.15", "python": "3.15"},
          {"env": "3.15t", "python": "3.15t"},
          {"env": "3.14", "python": "3.14"},
          {"env": "3.13", "python": "3.13"},
          {"env": "3.12", "python": "3.12"},
          {"env": "3.11", "python": "3.11"},
          {"env": "3.15", "python": "3.15", "os": "macos-15"},
          {"env": "3.15t", "python": "3.15t", "os": "macos-15"},
          {"env": "3.14", "python": "3.14", "os": "macos-15"},
          {"env": "3.13", "python": "3.13", "os": "macos-15"},
          {"env": "3.12", "python": "3.12", "os": "macos-15"},
          {"env": "3.11", "python": "3.11", "os": "macos-15"},
          {"env": "3.15", "python": "3.15", "os": "windows-2025"},
          {"env": "3.15t", "python": "3.15t", "os": "windows-2025"},
          {"env": "3.14", "python": "3.14", "os": "windows-2025"},
          {"env": "3.13", "python": "3.13", "os": "windows-2025"},
          {"env": "3.12", "python": "3.12", "os": "windows-2025"},
          {"env": "3.11", "python": "3.11", "os": "windows-2025"},
          {"env": "dev"},
          {"env": "dev", "os": "windows-2025"},
          {"env": "type"},
          {"env": "type", "os": "windows-2025"},
          {"env": "pkg_meta"},
          {"env": "pkg_meta", "os": "windows-2025"}
        ]
  release:
    name: 🏷️ Release dry run
    uses: ./.github/workflows/prepare-release.yaml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@e9dabf0e11825edd2b7ac6c152d9f4900f188815 # 6.7.0
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, release, hooks]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@bceb5c005e19823dc8835f536f53f172ae223927 # 6.5.0
        with:
          needs: ${{ toJSON(needs) }}
