name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  test:
    name: 🧪 test ${{ matrix.py }} - ${{ matrix.os }}
    if: github.event_name != 'schedule' || github.repository_owner == 'gaborbernat'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - name: 📦 Install tox with tox-uv
        run: uv tool install --managed-python --python 3.15 tox --with tox-uv
      - name: 🐍 Setup Python for test ${{ matrix.py }}
        run: uv python install ${{ matrix.py }}
      - name: 🏗️ Setup test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.py }}
      - name: 🏃 Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.py }}
        timeout-minutes: 20
        env:
          PYTEST_ADDOPTS: "-vv --durations=20"
          CI_RUN: "yes"
          DIFF_AGAINST: HEAD
  check:
    name: 🔎 check ${{ matrix.tox_env }} - ${{ matrix.os }}
    if: github.event_name != 'schedule' || github.repository_owner == 'gaborbernat'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        tox_env:
          - dev
          - type
          - pkg_meta
        os:
          - ubuntu-24.04
          - windows-2025
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🚀 Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🏗️ Setup check suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.tox_env }}
      - name: 🏃 Run check for ${{ matrix.tox_env }}
        run: tox run --skip-pkg-install -e ${{ matrix.tox_env }}
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        run: |
          uv venv --python 3.15 "$RUNNER_TEMP/release-tools"
          uv pip sync --preview-features pylock --python "$RUNNER_TEMP/release-tools/bin/python" --group release pylock.toml
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - uses: tox-dev/github-workflows/validate-news@84255555371c47578577079d168a4654fc749166
  release-dry-run:
    name: Release without publishing
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@84255555371c47578577079d168a4654fc749166
    permissions:
      contents: read
      pull-requests: read
    with:
      changelog: CHANGELOG.md
      fragments: changelog.d
      format: markdown
      artifact-base-url: https://pypi.org/project/mdformat-hugo/
  release-tools-preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          enable-cache: false
      - id: lock
        uses: tox-dev/github-workflows/refresh-release-lock@84255555371c47578577079d168a4654fc749166
        with:
          groups: release
          python-version: "3.15"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lock.outputs.changed == 'true'
        with:
          name: release-tools-lock-preview
          path: ${{ runner.temp }}/lock.patch
          if-no-files-found: error
          retention-days: 1
  gate:
    name: Required checks pass
    if: always()
    needs: [test, check, changelog, release-dry-run, release-tools-preview]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          jq -e --arg event "$EVENT_NAME" --arg ref "$REF" '
            all(
              to_entries[];
              .value.result == "success" or
              (.value.result == "skipped" and
                ((.key == "changelog" and $event != "pull_request") or
                (.key == "release-tools-preview" and $event != "pull_request") or
                 (.key == "release-dry-run" and $event != "pull_request" and
                    ($event != "workflow_dispatch" or $ref == "refs/heads/main"))))
            )
          ' <<< "$NEEDS_JSON"
