name: Release to PyPI
on:
  push:
    tags: ["*"]
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: 🏗️ Build
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@ef0cd88bef592260a48345753b8b509b209ab189 # 6.8.3
    permissions:
      contents: read
  notes:
    name: 📝 Render GitHub Release notes
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@ef0cd88bef592260a48345753b8b509b209ab189 # 6.8.3
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: CHANGELOG.md
      artifact-url: https://pypi.org/project/mdformat-hugo/${{ github.ref_name }}/
  release:
    name: 🚀 Publish to PyPI
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/mdformat-hugo/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: 📩 Download all the dists
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist/
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true
          packages-dir: dist
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [build, release, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@ef0cd88bef592260a48345753b8b509b209ab189 # 6.8.3
    permissions:
      contents: write
    with:
      project: mdformat-hugo
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
      artifact-pattern: python-package-distributions
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
      title-prefix: v
